<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toko Kita — Portal Utama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--background:#111114;--card:#1A1D24;--card-border:#262A33;--foreground:#F4F6FA;--muted:#8A8F9C;--primary:#F97316;--radius:20px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--background);color:var(--foreground);font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.wrap{max-width:400px;width:100%;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:32px;text-align:center}
.logo{width:60px;height:60px;border-radius:18px;background:var(--primary);color:#111;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:28px}
h1{font-family:'Sora';font-size:24px;margin-bottom:24px}
.nav-links{display:grid;gap:12px}
.nav-links a{display:block;background:var(--background);border:1px solid var(--card-border);padding:14px;border-radius:12px;color:var(--foreground);text-decoration:none;font-weight:600;transition:.2s}
.nav-links a:hover{border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">T</div>
  <h1>Toko Kita ERP</h1>
  <div class="nav-links">
    <a href="?page=admin">🛡️ Dashboard Admin</a>
    <a href="?page=pos">🛒 Panel Kasir</a>
    <a href="?page=absen">📍 Portal Karyawan</a>
  </div>
</div>
</body>
</html>
