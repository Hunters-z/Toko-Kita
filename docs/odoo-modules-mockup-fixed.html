<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toko Kita — Modul ERP</title>
<style>
:root { --bg:#111; --card:#1A1D24; --accent:#F97316; --txt:#eee; }
body { background:var(--bg); color:var(--txt); font-family:sans-serif; margin:0; }
.nav { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; padding:20px; }
.card { background:var(--card); padding:20px; border-radius:20px; border:1px solid #333; }
.btn { background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:12px; cursor:pointer; }
</style>
</head>
<body>
<div class="nav">
  <button class="btn">Keuangan</button>
  <button class="btn">Sales</button>
  <button class="btn">Website</button>
  <button class="btn">SCM</button>
  <button class="btn">HR</button>
  <button class="btn">Marketing</button>
</div>
<div style="padding:20px"><div class="card"><h1>Modul ERP Aktif</h1><p>Sistem modular ringan siap digunakan.</p></div></div>
</body>
</html>
